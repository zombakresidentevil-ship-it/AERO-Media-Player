name: Build Windows x64

on:
  push:
    paths:
      - "AERO_Media_Player_Project.zip"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AERO Media Player
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Check and extract source archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "AERO_Media_Player_Project.zip"
          if (-not (Test-Path $archive)) {
            throw "Upload AERO_Media_Player_Project.zip to the repository root first."
          }
          $sourceRoot = Join-Path $env:RUNNER_TEMP "AERO-source"
          Expand-Archive -LiteralPath $archive -DestinationPath $sourceRoot -Force
          $project = Join-Path $sourceRoot "AeroMediaPlayer"
          if (-not (Test-Path (Join-Path $project "app.py"))) {
            throw "The ZIP does not contain AeroMediaPlayer/app.py."
          }
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install VLC media engine
        shell: pwsh
        run: choco install vlc -y --no-progress

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          py -3.12 -m venv .venv
          & ".\.venv\Scripts\python.exe" -m pip install --upgrade pip
          & ".\.venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Run playlist tests
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          & ".\.venv\Scripts\python.exe" -m unittest discover -s tests -v

      - name: Build portable Windows application
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          $env:VLC_DIR = Join-Path $env:ProgramFiles "VideoLAN\VLC"
          & ".\build_win.ps1"

      - name: Package portable build
        shell: pwsh
        run: |
          $dist = Join-Path $env:PROJECT_DIR "dist\AERO Media Player"
          if (-not (Test-Path $dist)) {
            throw "PyInstaller output folder was not created."
          }
          $archive = Join-Path $env:GITHUB_WORKSPACE "AERO-Media-Player-Windows-x64.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $archive -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AERO-Media-Player-Windows-x64
          path: AERO-Media-Player-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
